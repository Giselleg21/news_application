{% extends 'News/base.html' %}

{% block content %}
<h1 style="text-align:center">My Articles</h1>

{% if articles %}
    <ul>
        {% for article in articles %}
            {% if article.author == user %}
                    <a href="{% url 'article_detail' article.id %}">
                        {{ article.title }}
                        <br><br>
                    </a>
            {% endif %}
        {% endfor %}
    </ul>
{% else %}
<p>You currently have no articles.</p>
{% endif %}
<a href="{% url 'article_create' %}">
    <button class="btn-primary">Add a new article</button>
</a>

{% endblock content %}
