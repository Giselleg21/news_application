
{% extends 'News/base.html' %}

{% block title %}
Manage Subscriptions - News Application
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <h1 class="text-center mb-4">
            Manage Subscriptions
        </h1>

        <p>
            Select the publishers and journalists you would
            like to subscribe to:
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Subscriptions
            </button>
        </form>

    </div>
</div>

{% endblock %}
