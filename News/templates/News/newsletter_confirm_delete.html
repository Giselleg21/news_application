{% extends 'News/base.html' %}

{% block title %}
    Delete Newsletter - News Application
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow-sm text-center">
            <div class="card-body">

                <h1 class="mb-4">
                    Delete Newsletter
                </h1>

                <p>
                    Are you sure you want to delete
                    <strong>{{ newsletter.title }}</strong>?
                </p>

                <p class="text-muted">
                    This action cannot be undone.
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Yes, Delete Newsletter
                    </button>

                    <a href="{% url 'newsletter_detail' newsletter.id %}"
                       class="btn btn-secondary" style="color:black">
                        Cancel
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock content %}
